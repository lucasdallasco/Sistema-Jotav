<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>Painel Jotav</title>
<link rel="icon" href="/admin/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/admin/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Painel Jotav">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>

:root{
  --laranja:#FC6701; --preto:#000; --grafite:#1C1C1F; --tinta:#1D1D1F; --suave:#6E6E73;
  --pagina:#F5F5F7; --card:#FFFFFF; --linha:#E5E5EA; --ok:#1F7A3D;
  --sans:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);background:var(--pagina);color:var(--tinta);-webkit-font-smoothing:antialiased;font-size:16px}
button,input,select{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:120px}
/* topo */
.top{position:sticky;top:0;z-index:20;background:rgba(245,245,247,.9);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--linha)}
.top .back{width:40px;height:40px;border-radius:50%;border:0;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;box-shadow:0 0 0 1px var(--linha)}
.top h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ver{font-size:14px;font-weight:600;color:var(--tinta);text-decoration:none;padding:9px 14px;border-radius:999px;background:#fff;box-shadow:0 0 0 1px var(--linha);white-space:nowrap}
.logo{width:36px;height:36px;flex:none}
.wrap{padding:20px}
/* tipografia */
.eyb{font-size:13px;font-weight:600;color:#C24E00;margin:0 0 6px}
h2{font-size:30px;line-height:1.1;letter-spacing:-.03em;margin:0;font-weight:700}
.lead{color:var(--suave);margin:8px 0 0;font-size:15px;line-height:1.5}
.sec{font-size:13px;font-weight:600;color:var(--suave);margin:28px 4px 10px}
/* início */
.hero{background:var(--preto);color:#F5F5F7;border-radius:28px;padding:26px 24px;margin-bottom:16px}
.hero h2{color:#F5F5F7}
.hero p{color:#A1A1A6;margin:8px 0 0;font-size:15px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:0;border-radius:24px;padding:20px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:14px;min-height:150px;box-shadow:0 0 0 1px var(--linha)}
.tile .ic{width:44px;height:44px;border-radius:14px;background:var(--pagina);display:flex;align-items:center;justify-content:center}
.tile b{font-size:17px;letter-spacing:-.01em}
.tile span{font-size:13px;color:var(--suave);margin-top:-8px}
.tile.big{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;gap:16px}
.tile.big .tx{display:flex;flex-direction:column;gap:2px;flex:1}
.tile.big .tx span{margin:0}
.tile.big .thumbs{display:flex}
.tile.big .thumbs img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:12px;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--linha);margin-left:-10px}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:16px -20px 0;padding:0 20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:#fff;border-radius:999px;padding:10px 16px;font-size:14px;font-weight:500;cursor:pointer;box-shadow:0 0 0 1px var(--linha)}
.chip.on{background:var(--tinta);color:#fff;box-shadow:none}
/* lista */
.list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.row{background:var(--card);border-radius:22px;padding:12px 14px 12px 12px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:0 0 0 1px var(--linha);border:0;text-align:left;width:100%}
.row.off{opacity:.5}
.row .ph{width:64px;height:64px;border-radius:16px;background:var(--pagina);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center}
.row .ph img{max-width:86%;max-height:86%;object-fit:contain}
.row .ph.foto img{max-width:none;max-height:none;width:100%;height:100%;object-fit:cover}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .nm{font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pr{font-size:14px;color:var(--suave)}
.row .pr b{color:var(--tinta);font-weight:600}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--pagina);color:var(--suave);align-self:flex-start}
.tag.lac{background:#EEF4FF;color:#2B4C8C}.tag.vit{background:#FFF1E8;color:#C24E00}.tag.nov{background:#1D1D1F;color:#fff}.tag.off{background:#F2F2F2;color:#8E8E93}
.chev{flex:none;color:#C7C7CC}
/* formulário */
.card{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 0 0 1px var(--linha)}
.card+.card{margin-top:12px}
.card h3{font-size:16px;margin:0 0 4px;font-weight:700}
.card .hint{font-size:13px;color:var(--suave);margin:0 0 14px;line-height:1.45}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field:first-child{margin-top:0}
label.l{font-size:13px;font-weight:600;color:var(--suave)}
.inp{width:100%;border:0;background:var(--pagina);border-radius:14px;padding:14px 16px;font-size:16px;outline:none;box-shadow:inset 0 0 0 1px transparent}
.inp:focus{box-shadow:inset 0 0 0 2px var(--tinta);background:#fff}
.money{position:relative}
.money span{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--suave);font-weight:500}
.money .inp{padding-left:46px;font-weight:600}
.seg{display:flex;background:var(--pagina);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:11px 8px;font-size:14px;font-weight:600;color:var(--suave);cursor:pointer}
.seg button.on{background:#fff;color:var(--tinta);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.photo{display:flex;align-items:center;gap:16px}
.photo .ph{width:96px;height:96px;border-radius:20px;background:var(--pagina);overflow:hidden;display:flex;align-items:center;justify-content:center;flex:none}
.photo .ph img{max-width:88%;max-height:88%;object-fit:contain}
.photo .ph.foto img{max-width:none;max-height:none;width:100%;height:100%;object-fit:cover}
.btn{border:0;border-radius:999px;padding:12px 18px;font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sec{background:#fff;box-shadow:0 0 0 1px var(--linha)}
.btn.pri{background:var(--tinta);color:#fff}
.btn.or{background:var(--laranja);color:#000}
.btn.del{background:transparent;color:#C0362C;padding-left:0}
.caps{display:flex;flex-direction:column;gap:10px}
.cap{display:grid;grid-template-columns:1fr 1.25fr 40px;gap:8px;align-items:center}
.x{width:40px;height:40px;border-radius:50%;border:0;background:var(--pagina);cursor:pointer;color:var(--suave);font-size:18px}
.add{margin-top:12px;border:1.5px dashed #C7C7CC;background:transparent;border-radius:14px;padding:12px;width:100%;font-weight:600;color:var(--suave);cursor:pointer;font-size:14px}
.cores{display:flex;flex-wrap:wrap;gap:8px}
.cor{display:inline-flex;align-items:center;gap:8px;background:var(--pagina);border-radius:999px;padding:6px 8px 6px 6px;font-size:14px;font-weight:500}
.cor i{width:24px;height:24px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.cor button{border:0;background:transparent;color:var(--suave);cursor:pointer;font-size:15px;padding:0 4px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--linha)}
.sw:first-of-type{border-top:0;padding-top:4px}
.sw div{display:flex;flex-direction:column;gap:2px}
.sw b{font-size:15px;font-weight:600}
.sw small{font-size:13px;color:var(--suave)}
.tg{width:52px;height:32px;border-radius:999px;background:#D1D1D6;border:0;position:relative;cursor:pointer;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tg.on{background:var(--ok)}
.tg.on::after{transform:translateX(20px)}
.ord{display:flex;align-items:center;gap:10px}
.ord button{width:44px;height:44px;border-radius:14px;border:0;background:var(--pagina);cursor:pointer;font-size:18px}
.ord span{flex:1;text-align:center;font-weight:600}
/* manutenção */
.mrow{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--linha)}
.mrow:first-child{border-top:0}
.mrow b{font-size:15px;font-weight:500}
.search{position:relative;margin-top:16px}
.search .inp{padding-left:44px;background:#fff;box-shadow:0 0 0 1px var(--linha)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%)}
/* barra de salvar */
.save{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));background:rgba(245,245,247,.92);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--linha);transform:translateY(110%);transition:transform .25s}
.save.show{transform:none}
.save .in{max-width:520px;margin:0 auto;display:flex;gap:10px;align-items:center}
.save .in p{flex:1;margin:0;font-size:14px;color:var(--suave)}
.save .btn{padding:14px 22px}
.toast{position:fixed;left:50%;top:20px;transform:translate(-50%,-140%);z-index:50;background:var(--tinta);color:#fff;border-radius:18px;padding:14px 18px;font-size:14px;font-weight:500;display:flex;gap:10px;align-items:center;transition:transform .3s;max-width:calc(100% - 40px);box-shadow:0 12px 30px rgba(0,0,0,.25)}
.toast.show{transform:translate(-50%,0)}
.toast i{width:22px;height:22px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center;flex:none;font-style:normal}
.demo{position:fixed;right:12px;bottom:12px;z-index:40;font-size:12px;font-weight:600;background:#fff;border:1px dashed var(--laranja);color:#C24E00;border-radius:999px;padding:6px 12px;pointer-events:none}
body.sujo .demo{bottom:100px}
/* login */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;background:var(--preto);color:#F5F5F7;text-align:center;gap:20px}
.login .logo{width:84px;height:84px}
.login h2{color:#F5F5F7;font-size:32px}
.login p{color:#A1A1A6;margin:0;max-width:300px;line-height:1.5}
.login .box{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;margin-top:10px}
.login .inp{background:#1C1C1F;color:#F5F5F7}
.login .inp:focus{background:#1C1C1F;box-shadow:inset 0 0 0 2px #F5F5F7}
.login .btn{padding:16px}
.hidden{display:none!important}
@media (min-width:600px){.app{padding-top:12px}}

.toast.erro i{background:#C0362C}
.login .err{color:#FF6B5E;font-size:14px;min-height:20px;margin:0}
.login .link{background:none;border:0;color:#A1A1A6;font-size:14px;cursor:pointer;text-decoration:underline;padding:6px}
.carregando{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--suave);font-size:15px}
.carregando img{width:64px;height:64px;animation:pulso 1.4s ease-in-out infinite}
@keyframes pulso{50%{opacity:.45;transform:scale(.94)}}
.sair{display:block;margin:28px auto 0;background:none;border:0;color:var(--suave);font-size:14px;cursor:pointer;text-decoration:underline}
.btn[disabled]{opacity:.55;cursor:default}
.galeria{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.gfoto{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:#E5E5EA}
.gfoto img{width:100%;height:100%;object-fit:cover;display:block}
.gfoto .ctl{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px;justify-content:space-between}
.gfoto .ctl button{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.92);cursor:pointer;font-size:16px;color:var(--tinta);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.gfoto .ctl .del{color:#C0362C}
.gfoto .n{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px}
.save{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.app{padding-bottom:200px}
.relogin{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.rbox{width:100%;max-width:480px;background:#fff;border-radius:28px;padding:26px 22px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;margin-bottom:70px}
.rbox h3{margin:0;font-size:20px}.rbox p{margin:0;color:var(--suave);font-size:14px}
.rbox .err{color:#C0362C;min-height:18px}
.rbox .link{background:none;border:0;color:var(--suave);font-size:14px;text-decoration:underline;cursor:pointer;padding:6px}
.quem{font-size:13px;color:var(--suave);text-align:center;margin-top:8px}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"><i id="toast-i">✓</i><span id="toast-t"></span></div>
<input type="file" id="arquivo" accept="image/*" hidden>
<input type="file" id="arquivos" accept="image/*" multiple hidden>

<script>
/* ===== Configuração ===== */
const ID = "/.netlify/identity";
const GIT = "/.netlify/git/github";
const BRANCH = "main";
const ARQ = {vitrine:"dados/vitrine.json", manutencao:"dados/manutencao.json", blindagem:"dados/blindagem.json", loja:"dados/loja.json", clientes:"dados/clientes.json"};
const LOGO = "/admin/logo.svg";
const SITE = location.origin;

const CONDN = {lacrado:"Lacrado",vitrine:"Vitrine",seminovo:"Seminovo"};
const CATN = {iphone:"iPhone",watch:"Apple Watch",airpods:"AirPods",jbl:"JBL",xiaomi:"Xiaomi",acessorios:"Acessórios"};
const ICON = {
  back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  chev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  iphone:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1D1D1F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="2.8"/><path d="M10.5 5h3"/></svg>',
  wrench:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1D1D1F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.1-3.1a6 6 0 0 1-7.9 7.9l-6.3 6.3a2.1 2.1 0 0 1-3-3l6.3-6.3a6 6 0 0 1 7.9-7.9z"/></svg>',
  shield:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1D1D1F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="2.8"/><path d="M9.5 10l4.5-4.5M9.5 14.5l6-6"/></svg>',
  store:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1D1D1F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9.5L5 4.5h14l1.5 5"/><path d="M4.5 9.5v10h15v-10M3.5 9.5h17M9.5 19.5v-5h5v5"/></svg>',
  search:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6E73" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  camera:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1D1D1F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6.5" width="18" height="13.5" rx="3"/><path d="M8.5 6.5l1.5-2.5h4l1.5 2.5"/><circle cx="12" cy="13" r="3.5"/></svg>',
  plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
};
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const brl = v => v==null||v==="" ? "" : Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const parseBRL = s => { s=String(s||"").replace(/[^\d,.-]/g,""); if(!s) return null; if(s.includes(",")) s=s.replace(/\./g,"").replace(",","."); else if(/\.\d{3}$/.test(s)) s=s.replace(/\./g,""); const n=parseFloat(s); return isNaN(n)?null:n; };
const clone = o => JSON.parse(JSON.stringify(o));
const limpa = o => JSON.parse(JSON.stringify(o,(k,v)=>k.startsWith("_")?undefined:v));
const slug = s => String(s||"aparelho").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "aparelho";

/* ===== base64 UTF-8 ===== */
function b64deUTF8(b){ const bin=atob(b.replace(/\s/g,"")); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new TextDecoder().decode(u); }
function utf8paraB64(s){ const u=new TextEncoder().encode(s); let bin=""; for(let i=0;i<u.length;i+=0x8000) bin+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(bin); }

/* ===== Sessão (Netlify Identity) ===== */
let sessao=null, usuario=null;
function guardarSessao(t){ sessao={access_token:t.access_token, refresh_token:t.refresh_token, expira:Date.now()+((t.expires_in||3600)*1000)-60000}; try{localStorage.setItem("jotav_sessao",JSON.stringify(sessao));}catch(e){} }
function lerSessao(){ try{ sessao=JSON.parse(localStorage.getItem("jotav_sessao")||"null"); }catch(e){ sessao=null; } }
function esquecerSessao(){ sessao=null; usuario=null; try{localStorage.removeItem("jotav_sessao");}catch(e){} }
async function idReq(path,opt={}){
  const r=await fetch(ID+path,opt); let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok){ const m=(j&&(j.error_description||j.msg||j.error))||("Erro "+r.status); const e=new Error(m); e.status=r.status; throw e; }
  return j;
}
const form = o => Object.entries(o).map(([k,v])=>encodeURIComponent(k)+"="+encodeURIComponent(v)).join("&");
async function entrar(email,senha){ guardarSessao(await idReq("/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:form({grant_type:"password",username:email,password:senha})})); }
async function token(forcar){
  if(!sessao) throw Object.assign(new Error("Sessão expirada"),{sessao:true});
  if(forcar || Date.now()>sessao.expira){
    try{ guardarSessao(await idReq("/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:form({grant_type:"refresh_token",refresh_token:sessao.refresh_token})})); }
    catch(e){ esquecerSessao(); throw Object.assign(new Error("Sessão expirada"),{sessao:true}); }
  }
  return sessao.access_token;
}
async function idAuth(path,opt={}){ const t=await token(); return idReq(path,{...opt,headers:{"Authorization":"Bearer "+t,"Content-Type":"application/json"}}); }

/* ===== GitHub via Git Gateway ===== */
async function git(path,opt={},tentativa=0){
  const t=await token();
  const r=await fetch(GIT+path,{cache:"no-store",...opt,headers:{"Authorization":"Bearer "+t,"Content-Type":"application/json"}});
  if(r.status===401){
    if(tentativa===0){ await token(true); return git(path,opt,1); }
    const tx=await r.text().catch(()=> "");
    throw Object.assign(new Error("Git Gateway 401 "+tx.slice(0,160)),{gateway:true});
  }
  if(!r.ok){ const tx=await r.text().catch(()=> ""); throw new Error("GitHub "+r.status+" "+tx.slice(0,160)); }
  return r.status===204?null:r.json();
}
async function lerJSON(path){ const j=await git("/contents/"+path+"?ref="+BRANCH); return JSON.parse(b64deUTF8(j.content)); }
async function commitar(arquivos,mensagem){
  const ref=await git("/git/refs/heads/"+BRANCH); const base=ref.object.sha;
  const atual=await git("/git/commits/"+base);
  const tree=[];
  for(const a of arquivos){ const b=await git("/git/blobs",{method:"POST",body:JSON.stringify({content:a.b64,encoding:"base64"})}); tree.push({path:a.path,mode:"100644",type:"blob",sha:b.sha}); }
  const t=await git("/git/trees",{method:"POST",body:JSON.stringify({base_tree:atual.tree.sha,tree})});
  const c=await git("/git/commits",{method:"POST",body:JSON.stringify({message:mensagem,tree:t.sha,parents:[base]})});
  await git("/git/refs/heads/"+BRANCH,{method:"PATCH",body:JSON.stringify({sha:c.sha})});
}

const inputArq=document.getElementById("arquivo");
async function reduzir(f,max){
  const url=URL.createObjectURL(f);
  const img=await new Promise((ok,er)=>{const i=new Image(); i.onload=()=>ok(i); i.onerror=()=>er(new Error("Não consegui abrir essa imagem.")); i.src=url;});
  const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
  let d=c.toDataURL("image/webp",.86), ext="webp";
  if(!d.startsWith("data:image/webp")){ d=c.toDataURL("image/png"); ext="png"; }
  return {d,ext};
}
inputArq.addEventListener("change",async()=>{
  const f=inputArq.files[0]; inputArq.value=""; if(!f||!rascunho) return;
  try{
    const {d,ext}=await reduzir(f,1200);
    const path=`img/produtos/${slug(rascunho.nome)}-${Date.now().toString(36)}.${ext}`;
    fotos[path]=d.split(",")[1]; rascunho.imagem="/"+path; rascunho._img=d;
    marcarSujo(); render();
  }catch(e){ toast(e.message,true); }
});

const inputArqs=document.getElementById("arquivos");
inputArqs.addEventListener("change",async()=>{
  const fs=[...inputArqs.files]; inputArqs.value=""; if(!fs.length) return;
  for(const f of fs){
    try{ const {d,ext}=await reduzir(f,1100); const path=`img/clientes/cliente-${Date.now().toString(36)}${Math.random().toString(36).slice(2,5)}.${ext}`;
      fotos[path]=d.split(",")[1]; estado.clientes.fotos.unshift({imagem:"/"+path,descricao:"Cliente da Jotav",_img:d}); }
    catch(e){ toast(e.message,true); }
  }
  marcarSujo(); render();
});

/* ===== Publicar ===== */
async function publicar(){
  const semNome=estado.aparelhos.find(p=>!String(p.nome||"").trim());
  if(semNome){ rascunho=semNome; tela={nome:"aparelho"}; render(); toast("Dê um nome ao aparelho antes de publicar.",true); return; }
  const atual=serializar(estado), arquivos=[];
  for(const k in atual) if(atual[k]!==original[k]) arquivos.push({path:ARQ[k],b64:utf8paraB64(atual[k])});
  const fs=fotosEmUso(); for(const k in fs) arquivos.push({path:k,b64:fs[k]});
  if(!arquivos.length){ marcarSujo(false); return; }
  publicando=true; render();
  try{
    const quem=primeiroNome()||(usuario&&usuario.email)||"painel";
    await commitar(arquivos,"Painel: atualização por "+quem);
    original=atual; fotos={}; base=clone(estado); publicando=false; marcarSujo(false); render();
    toast("Publicado. O site atualiza em 1 a 2 minutos.");
  }catch(e){
    publicando=false; render();
    console.error(e);
    if(e.sessao){ precisaLogin=true; erroLogin=""; render(); return; }
    if(e.gateway){ toast("O Netlify recusou a gravação no GitHub. Suas alterações continuam aqui. Avise a Dallas.",true); return; }
    toast("Não deu para publicar ("+String(e.message||"erro").slice(0,60)+"). Suas alterações continuam aqui.",true);
  }
}

/* ===== Eventos ===== */
root.addEventListener("submit",async e=>{
  e.preventDefault(); const f=e.target, fd=new FormData(f), btn=f.querySelector('button[type="submit"]');
  erroLogin=""; btn.disabled=true; if(fd.get("email")) ultimoEmail=String(fd.get("email")).trim();
  try{
    if(f.dataset.form==="login"){
      await entrar(fd.get("email").trim(),fd.get("senha"));
      await carregar(); return;
    }
    if(f.dataset.form==="relogin"){
      await entrar(fd.get("email").trim(),fd.get("senha"));
      precisaLogin=false; render(); publicar(); return;
    }
    if(f.dataset.form==="esqueci"){
      await idReq("/recover",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:fd.get("email").trim()})});
      tela={nome:"login"}; render(); toast("Se o e-mail tiver acesso, o link chega em instantes."); return;
    }
    if(f.dataset.form==="senha"){
      if(fd.get("senha")!==fd.get("senha2")) throw new Error("As senhas não são iguais.");
      if(convite.tipo==="invite"){
        guardarSessao(await idReq("/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:convite.token,type:"signup",password:fd.get("senha")})}));
        try{ await idAuth("/user",{method:"PUT",body:JSON.stringify({data:{full_name:fd.get("nome").trim()}})}); }catch(_){}
      }else{
        guardarSessao(await idReq("/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:convite.token,type:"recovery"})}));
        await idAuth("/user",{method:"PUT",body:JSON.stringify({password:fd.get("senha")})});
      }
      convite=null; await carregar(); return;
    }
  }catch(err){
    const m=String(err.message||"");
    erroLogin = /invalid|password|no user/i.test(m) ? (f.dataset.form==="login"||f.dataset.form==="relogin"?"E-mail ou senha incorretos.":"Link inválido ou expirado. Peça um novo.")
      : /not.*confirm/i.test(m) ? "Esse acesso ainda não foi confirmado pelo e-mail."
      : m || "Algo deu errado. Tente de novo.";
    render();
  }
});

root.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-go]"); if(!t||t.getAttribute("type")==="submit") return;
  const d=t.dataset;
  if(d.fecharlogin){ precisaLogin=false; erroLogin=""; render(); return; }
  if(d.esqueci){ erroLogin=""; tela={nome:"esqueci"}; render(); return; }
  if(d.voltarlogin){ erroLogin=""; tela={nome:"login"}; render(); return; }
  if(d.recarregar){ carregar(); return; }
  if(d.sair){ if(sujo&&!confirm("Sair sem publicar as alterações?")) return; esquecerSessao(); marcarSujo(false); tela={nome:"login"}; render(); return; }
  if(d.go){ if(d.go==="vitrine"&&tela.nome==="aparelho"){ tela={nome:"vitrine"}; rascunho=null; render(); return; } ir(d.go); return; }
  if(d.filtro){ filtro=d.filtro; render(); return; }
  if(d.ap!==undefined){ rascunho=estado.aparelhos[+d.ap]; tela={nome:"aparelho"}; window.scrollTo(0,0); render(); return; }
  if(d.novo){ rascunho={nome:"",marca:"Apple",categoria:"iphone",condicao:"lacrado",destaque:false,novidade:false,consultar_preco:false,observacao:"",imagem:"",foto_real:false,ativo:true,cores:[],capacidades:[{capacidade:"256 GB",preco:null}],_img:""}; estado.aparelhos.unshift(rascunho); tela={nome:"aparelho"}; marcarSujo(); window.scrollTo(0,0); render(); return; }
  if(d.cond){ rascunho.condicao=d.cond; verificarSujo(); render(); return; }
  if(d.tg){ const inv=d.inv==="1"; rascunho[d.tg]= inv ? (rascunho[d.tg]===false) : !rascunho[d.tg]; verificarSujo(); render(); return; }
  if(d.capadd){ (rascunho.capacidades=rascunho.capacidades||[]).push({capacidade:"",preco:null}); marcarSujo(); render(); return; }
  if(d.capdel!==undefined){ rascunho.capacidades.splice(+d.capdel,1); verificarSujo(); render(); return; }
  if(d.cordel!==undefined){ rascunho.cores.splice(+d.cordel,1); verificarSujo(); render(); return; }
  if(d.coradd){ const n=document.getElementById("cor-nome").value.trim(); if(!n) return; (rascunho.cores=rascunho.cores||[]).push({nome:n,cor:document.getElementById("cor-hex").value}); marcarSujo(); render(); return; }
  if(d.mover){ const A=estado.aparelhos,i=A.indexOf(rascunho),j=i+(+d.mover); if(j<0||j>=A.length) return; [A[i],A[j]]=[A[j],A[i]]; verificarSujo(); render(); return; }
  if(d.foto){ inputArq.click(); return; }
  if(d.addcli){ inputArqs.click(); return; }
  if(d.clidel!==undefined){ if(!confirm("Remover esta foto do site?")) return; estado.clientes.fotos.splice(+d.clidel,1); verificarSujo(); render(); return; }
  if(d.climv!==undefined){ const A=estado.clientes.fotos,i=+d.climv,j=i+(+d.d); if(j<0||j>=A.length) return; [A[i],A[j]]=[A[j],A[i]]; verificarSujo(); render(); return; }
  if(d.apagar){ if(!confirm("Apagar "+(rascunho.nome||"este aparelho")+"? Para esconder sem apagar, use “Mostrar no site”.")) return; estado.aparelhos.splice(estado.aparelhos.indexOf(rascunho),1); rascunho=null; tela={nome:"vitrine"}; verificarSujo(); render(); return; }
  if(d.serv!==undefined){ mServ=+d.serv; busca=""; render(); return; }
  if(d.tipo){ const s=estado.manutencao.servicos[mServ]; s.tipo = s.tipo==="preco"?"orcamento":"preco"; if(s.tipo==="preco"&&!s.precos) s.precos=[]; verificarSujo(); render(); return; }
  if(d.descartar){ estado=clone(base); fotos={}; rascunho=null; marcarSujo(false); if(tela.nome==="aparelho") tela={nome:"vitrine"}; render(); return; }
  if(d.publicar){ publicar(); return; }
});
root.addEventListener("input",e=>{
  const t=e.target, d=t.dataset;
  if(d.f){ rascunho[d.f]=t.value; if(d.f==="nome"){ const h=document.querySelector(".top h1"); if(h) h.textContent=t.value||"Novo aparelho"; } }
  else if(d.cap!==undefined){ const c=rascunho.capacidades[+d.cap]; if(d.k==="preco"){ const v=parseBRL(t.value); if(v==null) delete c.preco; else c.preco=v; } else c.capacidade=t.value; }
  else if(d.mp){ const s=estado.manutencao.servicos[mServ]; s.precos=s.precos||[]; const v=parseBRL(t.value); const it=s.precos.find(x=>x.modelo===d.mp); if(it){ if(v==null) s.precos.splice(s.precos.indexOf(it),1); else it.preco=v; } else if(v!=null) s.precos.push({modelo:d.mp,preco:v}); }
  else if(d.b){ const b=estado.blindagem; b[d.b]= d.b==="preco"?parseBRL(t.value): d.b==="acabamentos"? t.value.split(",").map(x=>x.trim()).filter(Boolean) : t.value; }
  else if(d.lj){ const L=estado.loja; L[d.lj]= d.lj==="horarios"? t.value.split("\n").map(x=>x.trim()).filter(Boolean) : t.value; if(d.lj==="whatsapp_exibir"){ const n=t.value.replace(/\D/g,""); L.whatsapp = n.startsWith("55")&&n.length>11 ? n : "55"+n; } }
  else return;
  verificarSujo();
});
root.addEventListener("change",e=>{ const t=e.target; if(t.dataset.f){ rascunho[t.dataset.f]=t.value; verificarSujo(); } if((t.dataset.cap!==undefined && t.dataset.k==="preco")||t.dataset.mp||t.dataset.b==="preco"){ t.value=brl(parseBRL(t.value)); } });
window.addEventListener("beforeunload",e=>{ if(sujo){ e.preventDefault(); e.returnValue=""; } });

/* ===== Início ===== */
(function iniciar(){
  const h=new URLSearchParams(location.hash.slice(1));
  const inv=h.get("invite_token"), rec=h.get("recovery_token");
  if(inv||rec){ convite={tipo:inv?"invite":"recovery",token:inv||rec}; history.replaceState(null,"",location.pathname); tela={nome:"senha"}; render(); return; }
  lerSessao();
  if(sessao) carregar(); else { tela={nome:"login"}; render(); }
})();
</script>
